name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:

  backend:
    name: Compiler & API

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt


      - name: Generate ANTLR sources
        run: |
          python scripts/build_antlr.py


      - name: Verify generated ANTLR files
        run: |
          test -f build/OPLangLexer.py
          test -f build/OPLangParser.py
          test -f build/OPLangVisitor.py
          test -f build/lexererr.py


      - name: Run compiler tests
        run: |
          python -m pytest tests -q


      - name: Run API tests
        run: |
          python -m pytest backend/tests -q


  frontend:
    name: Frontend

    runs-on: ubuntu-latest

    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json


      - name: Install dependencies
        run: npm ci


      - name: Build frontend
        run: npm run build


  docker:
    name: Docker

    runs-on: ubuntu-latest

    timeout-minutes: 20

    needs:
      - backend
      - frontend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Build Docker image
        run: |
          docker build \
            -t oplang-compiler-api:ci \
            .


      - name: Start Docker container
        run: |
          docker run \
            -d \
            --name oplang-api-ci \
            -p 8000:10000 \
            -e OPLANG_ALLOWED_ORIGINS=http://localhost:5173 \
            oplang-compiler-api:ci


      - name: Wait for health endpoint
        run: |
          for i in {1..30}; do

            if curl --fail --silent \
              http://127.0.0.1:8000/api/v1/health
            then
              echo
              echo "API is healthy."
              exit 0
            fi

            echo "Waiting for API..."
            sleep 2

          done

          echo "API failed to become healthy."
          docker logs oplang-api-ci
          exit 1


      - name: Show Docker logs
        if: always()
        run: |
          docker logs oplang-api-ci || true


      - name: Stop Docker container
        if: always()
        run: |
          docker rm -f oplang-api-ci || true
